[handle]
python_type = "NativeSnapshotHandleV1"
opaque = true
owning = true
sealed = true
registration = "exact-owner-type"
members = [
  { ordinal = 0, name = "publication_version", type = "int", kind = "property" },
  { ordinal = 1, name = "publication_ledger_sha256", type = "bytes32", kind = "property" },
  { ordinal = 2, name = "attestation", type = "NativeSnapshotAttestationV1", kind = "property" },
  { ordinal = 3, name = "closed", type = "bool", kind = "property" },
  { ordinal = 4, name = "close", type = "() -> None", kind = "method" },
]

[handle_registration]
rust_owner_module = "pyowl_core._native"
rust_owner_name = "_NativeSnapshotHandle"
owner_attestation_member = "_publication_attestation_v1"
owner_closed_member = "_publication_closed_v1"
owner_close_member = "_publication_close_v1"
exact_type_only = true
duplicate_policy = "idempotent-same-type-only"
fixture_owner = "bounded-immutable-two-slot-tuple"

[bounds]
max_api_component = 4294967295
max_diagnostic_details = 64
max_diagnostic_import_chain = 128
max_diagnostics_per_sequence = 10000
max_direct_imports_per_document = 10000000
max_document_key_utf8_bytes = 256
max_documents = 1000000
max_import_edges = 100000000
max_iri_utf8_bytes = 1048576
max_metadata_string_utf8_bytes = 4096
max_timing_name_utf8_bytes = 64
max_timing_rows = 64
max_total_diagnostics = 1000000

[capability_rules]
known_mask = 63
required_mask = 7
source_map_bit = 8
origin_index_bit = 16
rdf_mapping_report_bit = 32
source_map_option = "preserve_source_map"
origin_index_option = "collect_provenance"
table_counts_require_bits = true

[lifecycle]
initial_state = "open"
publication_state = "open-only"
close = "idempotent-thread-safe"
metadata_after_close = "readable"
copy = "identity-preserving"
pickle = "forbidden"
finalization = "owner-release"

[ordering]
documents = "document-key-utf8-ascending-unique"
import_edges = "document-key+canonical-iri+status+target-ascending"
direct_imports = "canonical-iri-bytes-ascending-unique"
diagnostic_sequences = "producer-order-preserved"
diagnostic_details = "producer-order-preserved-unique-keys"
report_timings = "name-utf8-ascending-unique"

[dynamic_limits]
documents = "min(bounds.max_documents,options.limits.max_documents)"
import_edges = "min(bounds.max_import_edges,options.limits.max_axioms)"
diagnostics = "min(bounds.max_total_diagnostics,options.limits.max_diagnostics)"
source_map_entries = "options.limits.max_source_map_entries"
origin_entries = "options.limits.max_origin_entries"

[metadata_rules]
diagnostic_code = "^[A-Z][A-Z0-9_]*$"
diagnostic_severity = "info|warning|error"
diagnostic_spans = "nonnegative-bytes+positive-text+forward-only"
provenance_digest_kind = "exact-bytes|normalized-text"
document_format = "rdfxml|turtle|owlxml|functional"
detection_basis = "explicit|media-type|content|extension"
scalar_details = "str|i64|bool"

[attestation_encoding]
digest = "sha256"
record = "ordinal-field-sequence"
scalar_codec = "tagged-length-framed-v1"
float = "finite-python-hex"
load_options_domain = "pyowl-core:native-load-options:v1"
report_domain = "pyowl-core:native-load-report:v1"
diagnostics_domain = "pyowl-core:native-diagnostics-manifest:v1"

[attestation_bindings]
four_digest_fields = ["root_table_sha256", "fingerprint_inputs_sha256", "source_manifest_sha256", "provenance_manifest_sha256"]
load_option_fields = ["format", "imports", "backend", "limits", "offline", "preserve_source_map", "collect_provenance", "validate_owl2_dl", "deterministic"]
parse_limit_fields = ["max_source_bytes", "max_documents", "max_total_source_bytes", "max_axioms", "max_terms", "max_nesting_depth", "max_rdf_list_length", "max_literal_bytes", "max_iri_bytes", "max_prefixes", "max_import_depth", "max_redirects", "max_diagnostics", "max_memory_bytes", "deadline_seconds", "max_triples", "max_strings", "max_annotations", "max_rule_atoms", "max_sequence_arity", "max_catalog_rewrites", "max_resolver_attempts", "max_concurrent_fetches", "max_source_map_entries", "max_origin_entries", "max_overlay_depth", "max_delta_entries", "max_composite_members", "max_index_rows", "max_index_bytes", "max_wire_rows", "max_wire_bytes", "max_temporary_bytes", "max_disk_cache_bytes", "max_decompressed_bytes", "max_canonical_work", "cancellation_check_interval"]
report_fields = ["backend", "api_version", "model_schema", "document_count", "total_source_bytes", "effective_axiom_count", "resolution_attempts", "acquisition_cache_hits", "document_cache_hits", "timings", "structural_fingerprint", "logical_fingerprint", "signature_fingerprint", "owl2_dl_validated", "owl2_dl_conforms", "owl2_dl_report_sha256"]
capability_backed_counts = ["source_map_entry_count", "origin_entry_count", "rdf_mapping_report_count"]
source_map_table = "source_manifest_sha256+source_map_entry_count"
origin_table = "provenance_manifest_sha256+origin_entry_count"
rdf_mapping_tables = "documents[].rdf_mapping_report_sha256+rdf_mapping_report_count"

[rust_parity]
required = true
record = "NativeSnapshotPublicationV1"
attestation = "NativeSnapshotAttestationV1"
status_claim = "none-until-runtime-registration"
