[package]
name = "pyowl-core-native-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
pyo3 = { version = "=0.29.0", default-features = false, features = ["macros"] }

[[bin]]
name = "functional"
path = "fuzz_targets/functional.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[profile.release]
panic = "unwind"
overflow-checks = true
debug = 1

[workspace]
members = ["."]
