name: Wheels

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_DATE_EPOCH: "1735689600"

jobs:
  source-distributions:
    name: Pure wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Select the pinned artifact toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
          rustc --version | grep 'rustc 1.97.1'
      - name: Install pinned build tools
        run: >-
          python -m pip install
          build==1.5.0 setuptools==83.0.0 wheel==0.45.1
      - name: Validate dependency and license evidence
        run: |
          python -m tools.packaging.supply_chain --output-dir candidate/supply-chain
          python -m tools.packaging.supply_chain --check --output-dir candidate/supply-chain
      - name: Run the maintained RustSec advisory scan
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          mkdir -p candidate/security
          cargo audit --deny warnings --file native/Cargo.lock --json | tee candidate/security/rustsec.json
      - name: Build fixed-epoch pure wheel and sdist
        env:
          PYOWL_CORE_BUILD_NATIVE: "0"
        run: |
          python -m build --no-isolation --wheel --outdir candidate/direct
          python -m build --no-isolation --sdist --outdir candidate/sdist-a
          python -m build --no-isolation --sdist --outdir candidate/sdist-b
          cmp candidate/sdist-a/*.tar.gz candidate/sdist-b/*.tar.gz
          mkdir -p candidate/dist
          cp candidate/sdist-a/*.tar.gz candidate/dist/
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = next(Path("candidate/dist").glob("*.tar.gz"))
          target = Path("candidate/unpacked")
          target.mkdir(parents=True)
          with tarfile.open(archive, "r:gz") as source:
              source.extractall(target, filter="data")
          PY
          (
            cd candidate/unpacked/pyowl_core-0.1.0
            PYOWL_CORE_BUILD_NATIVE=0 SOURCE_DATE_EPOCH=1735689600 python -m build --no-isolation --wheel --outdir ../../rebuilt
          )
          cmp candidate/direct/*.whl candidate/rebuilt/*.whl
          cp candidate/direct/*.whl candidate/dist/
      - name: Inspect source distributions
        run: >-
          python -m tools.packaging.artifact_inspector
          candidate/dist/*
          --output candidate/source-inspection.json
      - name: Emit deterministic SBOMs
        run: python -m tools.packaging.supply_chain --check --output-dir candidate/supply-chain
      - name: Record checksums
        run: |
          mkdir -p source-artifact
          cp -R candidate/dist source-artifact/dist
          cp -R candidate/supply-chain source-artifact/supply-chain
          cp -R candidate/security source-artifact/security
          cp candidate/source-inspection.json source-artifact/source-inspection.json
          cp reports/release/0.1.0/gates.json source-artifact/gates.json
          cd source-artifact
          sha256sum dist/* | LC_ALL=C sort > source-SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-distributions
          path: source-artifact/
          if-no-files-found: error
          retention-days: 14

  pure-runtime:
    name: Pure / ${{ matrix.python }}
    needs: source-distributions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.10"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-distributions
          path: candidate
      - name: Install the universal wheel without a compiler build
        run: |
          python -m pip install pytest==8.4.2 hypothesis==6.148.7 tomli==2.2.1
          python -m pip install --no-deps --no-index candidate/dist/*-py3-none-any.whl
      - name: Prove pure import and complete behavior
        env:
          PYOWL_CORE_BUILD_NATIVE: "0"
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('pyowl_core._native') is None"
          python -m tools.packaging.import_probe
          python -m pytest -q
          python docs/examples/parse_once.py
          python docs/examples/secure_local_import.py

  native-wheels:
    name: Native / ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    env:
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_BUILD_VERBOSITY: "1"
      CIBW_ENVIRONMENT_PASS_LINUX: "PYOWL_CORE_BUILD_PASS"
      CIBW_ENVIRONMENT: >-
        CARGO_TARGET_DIR="$(pwd)/.cibw-target-$PYOWL_CORE_BUILD_PASS"
        MACOSX_DEPLOYMENT_TARGET=13.0
        PYOWL_CORE_BUILD_NATIVE=1
        PYOWL_CORE_DOCS_BACKEND=native
        PYOWL_CORE_TEST_NATIVE_LIBRARY=1
        SOURCE_DATE_EPOCH=1735689600
      CIBW_ENVIRONMENT_LINUX: >-
        CARGO_TARGET_DIR="$(pwd)/.cibw-target-$PYOWL_CORE_BUILD_PASS"
        PATH=$HOME/.cargo/bin:$PATH
        PYOWL_CORE_BUILD_NATIVE=1
        PYOWL_CORE_DOCS_BACKEND=native
        PYOWL_CORE_TEST_NATIVE_LIBRARY=1
        SOURCE_DATE_EPOCH=1735689600
      CIBW_BEFORE_ALL_LINUX: >-
        arch=$(uname -m) &&
        base=https://static.rust-lang.org/rustup/archive/1.27.1/${arch}-unknown-linux-gnu &&
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error
        ${base}/rustup-init --output /tmp/rustup-init &&
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error
        ${base}/rustup-init.sha256 --output /tmp/rustup-init.sha256 &&
        cd /tmp && sha256sum --check rustup-init.sha256 &&
        chmod +x rustup-init &&
        ./rustup-init -y --profile minimal
        --default-toolchain 1.83.0 --no-modify-path
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_TEST_REQUIRES: "pytest==8.4.2 hypothesis==6.148.7 tomli==2.2.1"
      CIBW_TEST_ENVIRONMENT: >-
        PYOWL_CORE_DOCS_BACKEND=native
        PYOWL_CORE_TEST_NATIVE_LIBRARY=1
      CIBW_TEST_COMMAND: >-
        python -c "import pyowl_core._native as n;
        n.self_test();
        assert n.WIRE_FORMAT_VERSION == (1, 1)" &&
        python -c "import os, sys, pytest;
        project = os.path.realpath(r'{project}');
        sys.path.insert(0, project);
        raise SystemExit(pytest.main(['-q', '-p', 'no:cacheprovider',
        os.path.join(project, 'tests')]))" &&
        python {project}/docs/examples/parse_once.py &&
        python {project}/docs/examples/secure_local_import.py
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux-x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - lane: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - lane: macos-x86_64
            os: macos-15-intel
            platform: macos
            arch: x86_64
          - lane: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64
          - lane: windows-x86_64
            os: windows-latest
            platform: windows
            arch: AMD64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Select the pinned artifact toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
          rustc --version | grep 'rustc 1.97.1'
          cargo --version
      - name: Build and test version-specific native wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          PYOWL_CORE_BUILD_PASS: candidate
        with:
          output-dir: wheelhouse
      - name: Rebuild native wheels from the same source and toolchain
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_TEST_COMMAND: ""
          CIBW_TEST_REQUIRES: ""
          PYOWL_CORE_BUILD_PASS: rebuild
        with:
          output-dir: wheelhouse-rebuilt
      - name: Require byte-identical native rebuilds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          first = {path.name: path.read_bytes() for path in Path("wheelhouse").glob("*.whl")}
          second = {
              path.name: path.read_bytes()
              for path in Path("wheelhouse-rebuilt").glob("*.whl")
          }
          assert len(first) == 5, first.keys()
          assert first == second, set(first) ^ set(second)
          PY
      - name: Structural archive audit
        shell: bash
        run: >-
          python -m tools.packaging.artifact_inspector
          wheelhouse/*.whl
          --output native-inspection-${{ matrix.lane }}.json
      - name: Linux target-platform policy audit
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python -m pip install auditwheel==6.4.2
          mkdir -p platform-audit
          python -m tools.packaging.platform_audit audit wheelhouse/*.whl \
            --lane "${{ matrix.lane }}" \
            --source-revision "${{ github.sha }}" \
            --output "platform-audit/${{ matrix.lane }}.json"
      - name: macOS target-platform policy audit
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python -m pip install delocate==0.13.0
          mkdir -p platform-audit
          python -m tools.packaging.platform_audit audit wheelhouse/*.whl \
            --lane "${{ matrix.lane }}" \
            --source-revision "${{ github.sha }}" \
            --output "platform-audit/${{ matrix.lane }}.json"
      - name: Windows target-platform policy audit
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m pip install delvewheel==1.11.2
          New-Item -ItemType Directory -Force platform-audit | Out-Null
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          $env:PATH = "$($dumpbin.Directory.FullName);$env:PATH"
          $wheels = (Get-ChildItem wheelhouse/*.whl).FullName
          python -m tools.packaging.platform_audit audit $wheels `
            --lane "${{ matrix.lane }}" `
            --source-revision "${{ github.sha }}" `
            --output "platform-audit/${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.lane }}
          path: |
            wheelhouse/*.whl
            native-inspection-${{ matrix.lane }}.json
            platform-audit/${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate immutable candidate
    needs: [source-distributions, pure-runtime, native-wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-distributions
          path: incoming/source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: incoming/native
          merge-multiple: true
      - name: Assemble and validate the 27 distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          output = Path("candidate/dist")
          output.mkdir(parents=True)
          artifacts = sorted(Path("incoming").rglob("*.whl"))
          artifacts.extend(sorted(Path("incoming").rglob("*.tar.gz")))
          for source in artifacts:
              target = output / source.name
              if target.exists():
                  raise SystemExit(f"duplicate artifact name: {source.name}")
              shutil.copy2(source, target)
          wheels = tuple(output.glob("*.whl"))
          pure = tuple(output.glob("*-py3-none-any.whl"))
          native = tuple(path for path in wheels if path not in pure)
          sdists = tuple(output.glob("*.tar.gz"))
          assert len(pure) == 1, len(pure)
          assert len(native) == 25, len(native)
          assert len(sdists) == 1, len(sdists)
          assert len(tuple(output.iterdir())) == 27
          audit_files = sorted(
              path
              for path in Path("incoming/native").rglob("*.json")
              if path.parent.name == "platform-audit"
          )
          assert len(audit_files) == 5, len(audit_files)
          audit_output = Path("candidate/platform-audit")
          audit_output.mkdir()
          for source in audit_files:
              shutil.copy2(source, audit_output / source.name)
          supply = tuple(
              path
              for path in Path("incoming/source").rglob("supply-chain")
              if path.is_dir()
          )
          security = tuple(
              path
              for path in Path("incoming/source").rglob("security")
              if path.is_dir()
          )
          gates = tuple(Path("incoming/source").rglob("gates.json"))
          assert len(supply) == 1, supply
          assert len(security) == 1, security
          assert len(gates) == 1, gates
          shutil.copytree(supply[0], "candidate/supply-chain")
          shutil.copytree(security[0], "candidate/security")
          shutil.copy2(gates[0], "candidate/gates.json")
          PY
      - name: Inspect every artifact and scan Java indicators
        run: >-
          python -m tools.packaging.artifact_inspector
          candidate/dist/*
          --output candidate/artifact-inspection.json
      - name: Revalidate dependency inventory and SBOMs
        run: python -m tools.packaging.supply_chain --check --output-dir candidate/supply-chain
      - name: Verify the checksum-bound target-platform audit set
        run: >-
          python -m tools.packaging.platform_audit verify-set
          candidate/platform-audit/*.json
          --artifact-dir candidate/dist
          --source-revision "${{ github.sha }}"
          --output candidate/platform-audit-summary.json
      - name: Record successful advisory and platform gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          advisory_path = Path("candidate/security/rustsec.json")
          advisory = json.loads(advisory_path.read_text(encoding="utf-8"))
          assert isinstance(advisory, dict)
          platform_path = Path("candidate/platform-audit-summary.json")
          platform = json.loads(platform_path.read_text(encoding="utf-8"))
          assert platform["status"] == "passed"
          assert platform["source_revision"] == os.environ["GITHUB_SHA"]
          assert platform["lane_count"] == 5
          assert platform["wheel_count"] == 25
          path = Path("candidate/gates.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          payload["gates"]["advisory_scan"] = {
              "status": "passed",
              "evidence": (
                  f"{run_url}: cargo-audit 0.22.2 passed; evidence sha256 "
                  f"{hashlib.sha256(advisory_path.read_bytes()).hexdigest()}"
              ),
          }
          payload["gates"]["platform_artifact_audit"] = {
              "status": "passed",
              "evidence": (
                  f"{run_url}: 25 native wheels and five checksum-bound "
                  f"target-platform manifests passed; summary sha256 "
                  f"{hashlib.sha256(platform_path.read_bytes()).hexdigest()}"
              ),
          }
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Test the complete local-index target resolver matrix
        run: |
          python -m venv /tmp/pyowl-native-env
          /tmp/pyowl-native-env/bin/pip install --no-index --no-deps --find-links candidate/dist pyowl-core==0.1.0
          /tmp/pyowl-native-env/bin/python -c "import pyowl_core._native as n; n.self_test()"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import subprocess
          import sys

          dist = Path("candidate/dist").resolve()
          root = Path("/tmp/pyowl-resolver-matrix")
          if root.exists():
              shutil.rmtree(root)
          root.mkdir()
          targets = []
          platforms = (
              "manylinux_2_28_x86_64",
              "manylinux_2_28_aarch64",
              "macosx_13_0_x86_64",
              "macosx_13_0_arm64",
              "win_amd64",
          )
          for platform in platforms:
              for version in range(310, 315):
                  targets.append(
                      {
                          "id": f"cp{version}-{platform}",
                          "platform": platform,
                          "implementation": "cp",
                          "python": str(version),
                          "abi": f"cp{version}",
                          "expected": f"-cp{version}-cp{version}-{platform}.whl",
                      }
                  )
          targets.extend(
              (
                  {
                      "id": "generic-py310",
                      "platform": "any",
                      "implementation": "py",
                      "python": "310",
                      "abi": "none",
                      "expected": "-py3-none-any.whl",
                  },
                  {
                      "id": "pypy310-pure",
                      "platform": "any",
                      "implementation": "pp",
                      "python": "310",
                      "abi": "pp310",
                      "expected": "-py3-none-any.whl",
                  },
                  {
                      "id": "cp315-pure-fallback",
                      "platform": "manylinux_2_28_x86_64",
                      "implementation": "cp",
                      "python": "315",
                      "abi": "cp315",
                      "expected": "-py3-none-any.whl",
                  },
                  {
                      "id": "cp314t-pure-fallback",
                      "platform": "manylinux_2_28_x86_64",
                      "implementation": "cp",
                      "python": "314",
                      "abi": "cp314t",
                      "expected": "-py3-none-any.whl",
                  },
              )
          )
          results = []
          for target in targets:
              destination = root / target["id"]
              destination.mkdir()
              subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "pip",
                      "download",
                      "--no-index",
                      "--no-deps",
                      "--only-binary=:all:",
                      "--find-links",
                      str(dist),
                      "--platform",
                      target["platform"],
                      "--implementation",
                      target["implementation"],
                      "--python-version",
                      target["python"],
                      "--abi",
                      target["abi"],
                      "--dest",
                      str(destination),
                      "pyowl-core==0.1.0",
                  ],
                  check=True,
              )
              selected = tuple(destination.glob("*.whl"))
              assert len(selected) == 1, (target, selected)
              assert selected[0].name.endswith(target["expected"]), (
                  target,
                  selected[0].name,
              )
              results.append(
                  {
                      **target,
                      "selected": selected[0].name,
                      "sha256": hashlib.sha256(selected[0].read_bytes()).hexdigest(),
                  }
              )
          assert len(results) == 29
          Path("candidate/resolver-matrix.json").write_text(
              json.dumps(
                  {
                      "schema": "pyowl-core.resolver-matrix/1",
                      "status": "passed",
                      "targets": results,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Bind checksums and the fail-closed decision report
        run: |
          (
            cd candidate
            sha256sum dist/* | LC_ALL=C sort > SHA256SUMS
          )
          python -m tools.packaging.release_report candidate/dist --source-revision "${{ github.sha }}" --gate-file candidate/gates.json --output candidate/release-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
