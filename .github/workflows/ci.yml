name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        hashseed: ["1", "987654"]
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install pip==25.3
      - run: python -m pip install -e ".[dev]"
      - run: python tools/check.py --full

  pure-package:
    runs-on: ubuntu-24.04
    container: python:3.10-slim@sha256:e8d6cdadc17ce7146e1bb286e6093d58c8cf582659a558ad51cd103829655e72
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prove compiler and Java are absent
        run: |
          ! command -v java
          ! command -v javac
          ! command -v rustc
          ! command -v cc
      - run: python -m pip install build==1.5.0 setuptools==83.0.0 wheel==0.45.1
      - run: PYOWL_CORE_BUILD_NATIVE=0 PIP_NO_INDEX=1 python -m build --no-isolation
      - run: python -m tools.audit.java dist
      - run: python -m venv /tmp/pyowl-core-smoke
      - run: PIP_NO_INDEX=1 /tmp/pyowl-core-smoke/bin/pip install --no-deps dist/*.whl
      - run: /tmp/pyowl-core-smoke/bin/python -I -c "import pyowl_core; assert pyowl_core.__version__ == '0.1.1'"
