[package]
name = "pyowl-core-direct-comparator"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.186"
pyowl-native = { package = "pyowl-core-native", path = "../../../../native", default-features = false, features = ["comparator"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
