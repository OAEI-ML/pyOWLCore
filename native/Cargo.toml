[package]
name = "pyowl-core-native"
version = "0.2.0"
description = "Private Java-free native foundation for pyowl-core"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["dep:pyo3", "dep:pyo3-build-config", "pyo3/extension-module"]
comparator = []
test-hooks = ["extension-module"]
process-allocator-test = []

[[test]]
name = "process_allocator_failure"
path = "tests/process_allocator_failure.rs"
required-features = ["process-allocator-test"]

[dependencies]
pyo3 = { version = "=0.29.0", default-features = false, features = ["macros"], optional = true }

[build-dependencies]
pyo3-build-config = { version = "=0.29.0", optional = true }

[profile.dev]
panic = "unwind"
overflow-checks = true

[profile.release]
panic = "unwind"
overflow-checks = true
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[workspace]
resolver = "2"
