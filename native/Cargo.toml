[package]
name = "pyowl-core-native"
version = "0.1.0-dev.0"
description = "Private Java-free native foundation for pyowl-core"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
comparator = []
test-hooks = []

[dependencies]
pyo3 = { version = "=0.29.0", default-features = false, features = ["macros"] }

[build-dependencies]
pyo3-build-config = { version = "=0.29.0" }

[profile.dev]
panic = "unwind"
overflow-checks = true

[profile.release]
panic = "unwind"
overflow-checks = true
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[workspace]
resolver = "2"
